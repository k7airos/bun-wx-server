name: ci

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun run check
      - run: bun run build:binary
      - uses: actions/upload-artifact@v4
        with:
          name: blog-wx-bun-service-linux-x64
          path: dist/blog-wx-bun-service
